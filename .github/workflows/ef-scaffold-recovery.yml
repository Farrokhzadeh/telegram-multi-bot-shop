name: EF migration scaffold recovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ef-scaffold-recovery.yml']
permissions:
  contents: read
jobs:
  scaffold:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_PROCESSOR_COUNT: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json
      - name: Restore pinned metadata tooling
        run: |
          dotnet tool restore
          dotnet restore src/Platform.Persistence/Platform.Persistence.csproj -r linux-x64 --locked-mode
          dotnet build src/Platform.Persistence/Platform.Persistence.csproj -c Release --no-restore -m:2 -p:UseSharedCompilation=false --verbosity minimal
      - name: Generate provider-specific source only
        run: |
          dotnet ef migrations add InitialEfBaseline --project src/Platform.Persistence/Platform.Persistence.csproj --context SqliteAkantiDbContext --output-dir Migrations/Sqlite --configuration Release --no-build
          dotnet ef migrations add InitialEfBaseline --project src/Platform.Persistence/Platform.Persistence.csproj --context PostgresAkantiDbContext --output-dir Migrations/PostgreSql --configuration Release --no-build
      - name: Export generated code for coordinator recovery
        shell: python
        run: |
          import hashlib,json
          from pathlib import Path
          for path in sorted(Path('src/Platform.Persistence/Migrations').glob('*/*.cs')):
            body=path.read_text(encoding='utf-8-sig')
            body='\n'.join(line for line in body.splitlines() if line.strip()!='/// <inheritdoc />')+'\n'
            parts=[body[i:i+12000] for i in range(0,len(body),12000)]
            for index,part in enumerate(parts):
              print('EF_SOURCE_CHUNK '+json.dumps({'path':str(path),'index':index,'parts':len(parts),'length':len(body),'content':part},ensure_ascii=True))
            print('EF_SOURCE_FILE '+json.dumps({'path':str(path),'length':len(body),'sha256':hashlib.sha256(body.encode()).hexdigest()}))
