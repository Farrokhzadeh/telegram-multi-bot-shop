name: Offline backend qualification
on:
  push:
    branches: [main, 'impl/**']
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: Publish to Docker Hub and deploy to staging
        type: boolean
        default: false
      staging_backend:
        description: Redeploy the accepted SQLite staging runtime
        type: choice
        default: none
        options:
          - none
          - sqlite
permissions:
  contents: read
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' && inputs.deploy_staging && inputs.staging_backend == 'sqlite') && 'akanti-staging' || format('backend-{0}', github.ref) }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: shop_test_control
          POSTGRES_USER: shop_test_runner
          POSTGRES_PASSWORD: public-synthetic-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U shop_test_runner -d shop_test_control"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      SHOP_TEST_ALLOW_DATABASE_CREATION: '1'
      SHOP_TEST_POSTGRES_ADMIN: Host=127.0.0.1;Port=5432;Database=shop_test_control;Username=shop_test_runner;Password=public-synthetic-ci-password;Include Error Detail=false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json
      - name: Secret scan
        shell: bash
        run: |
          if curl --fail --location --retry 5 --retry-all-errors https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz; then
            echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
            tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          else
            test "$(go env GOSUMDB)" = sum.golang.org
            GOBIN=/tmp go install github.com/zricethezav/gitleaks/v8@v8.30.1
          fi
          /tmp/gitleaks dir . --redact --config .gitleaks.toml
      - name: Validate isolated SQLite staging deployment tooling
        run: |
          for script in ops/staging/deploy-{sqlite-runtime,dockerhub}.sh; do bash -n "$script"; done
          python3 -m py_compile ops/staging/{sqlite-stage-provision,provision_synthetic_stage,verify_synthetic_stage,check_ci_canary}.py
      - name: Validate secret mount contract (render only)
        run: python3 ops/ci/check-secret-compose.py
      - name: Install offline verifier test dependencies
        run: |
          python3 -m venv /tmp/legacy-verifier-tests
          /tmp/legacy-verifier-tests/bin/python -m pip install -r ops/ci/legacy-assets-requirements.txt
      - name: Validate scenario mappings and evidence guards
        run: |
          python3 .specify/tests/test_linux_tooling.py
          python3 ops/staging/test_wallet_shop.py
          /tmp/legacy-verifier-tests/bin/python -m unittest discover -s ops/ci/tests -v
          python3 ops/ci/check-acceptance-evidence.py --catalog-only
      - name: Restore locked dependencies
        run: dotnet restore Platform.sln -r linux-x64 --locked-mode
      - name: Build
        run: dotnet build Platform.sln -c Release --no-restore
      - name: Formatting
        run: dotnet format whitespace Platform.sln --verify-no-changes --no-restore
      - name: Prepare isolated managed staging test actor
        run: |
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" /stage /probe
          dotnet build ops/staging/managed_stage_probe/Probe.csproj -c Release -o /probe \
            -p:AssemblyName=StageHost \
            -p:StageRuntimeDirectory="$PWD/tests/Platform.IntegrationTests/bin/Release/net10.0"
      - name: Test synthetic and disposable contracts
        env:
          SHOP_CUTOVER_STAGE: synthetic-acc-abad-v1
          SHOP_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          result=0
          for suite in UnitTests IntegrationTests ContractTests; do
            dotnet test "tests/Platform.${suite}/Platform.${suite}.csproj" -c Release --no-build --no-restore --logger 'trx;LogFileName=qualification.trx' --results-directory "artifacts/test-results/${suite}" || result=1
          done
          exit "$result"
      - name: Publish and run managed Linux backend
        env:
          SHOP_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          bash ops/ci/native-smoke.sh --managed
          status=0
          artifacts/managed/JobHost/Platform.JobHost --serve-sqlite-staging || status=$?
          test "$status" -eq 78
      - name: Record redacted acceptance evidence
        run: |
          python3 ops/ci/check-acceptance-evidence.py --results-root artifacts/test-results --output artifacts/acceptance/scenario-witnesses.json
          sha256sum artifacts/acceptance/*.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: offline-qualification-${{ github.sha }}
          path: |
            artifacts/acceptance/
            artifacts/migration/
            artifacts/contracts/
            artifacts/managed/SchemaRunner/
            artifacts/managed/JobHost/
            artifacts/managed/AotSmoke/
            artifacts/test-results/
            **/packages.lock.json
          retention-days: 7
  build-staging-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json
      - name: Install native compiler
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Publish and smoke-test managed staging API and bot
        shell: bash
        run: |
          sdk_options=(-c Release -r linux-x64 -p:PublishAot=false)
          dotnet restore src/Platform.Api/Platform.Api.csproj -r linux-x64 --locked-mode
          dotnet publish src/Platform.Api/Platform.Api.csproj "${sdk_options[@]}" --no-restore --no-self-contained -o artifacts/staging/Api
          artifacts/staging/Api/Platform.Api --qualify
          status=0
          artifacts/staging/Api/Platform.Api --serve-sqlite-staging || status=$?
          test "$status" -eq 78
          status=0
          artifacts/staging/Api/Platform.Api || status=$?
          test "$status" -eq 78
          dotnet restore src/Platform.BotHost/Platform.BotHost.csproj -r linux-x64 --locked-mode
          dotnet publish src/Platform.BotHost/Platform.BotHost.csproj "${sdk_options[@]}" --no-restore --self-contained -o artifacts/staging/BotHost
          artifacts/staging/BotHost/Platform.BotHost --qualify-ingress
          status=0
          artifacts/staging/BotHost/Platform.BotHost --serve-sqlite-staging || status=$?
          test "$status" -eq 78
          status=0
          artifacts/staging/BotHost/Platform.BotHost --serve-staging-preview --root /run/akanti-preview || status=$?
          test "$status" -eq 78
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 020e5996006c8867b1d64e24a31f174ce344c4c4
          path: aot-baseline
          persist-credentials: false
      - name: Run the pinned historical Native AOT canary
        shell: bash
        run: |
          docker pull --platform linux/amd64 mcr.microsoft.com/dotnet/sdk@sha256:212fe4cb74627d5adf9817a4088906ae3edff1bd853bb27565d4b46731efe61e
          docker pull --platform linux/amd64 postgres@sha256:bd5dfa494a5a259704365813dbfa5fa6b3e69be7348d43b547f540c730478583
          docker tag postgres@sha256:bd5dfa494a5a259704365813dbfa5fa6b3e69be7348d43b547f540c730478583 postgres:18.6
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          dotnet restore aot-baseline/src/Platform.Api/Platform.Api.csproj -r linux-x64 --locked-mode
          dotnet publish aot-baseline/src/Platform.Api/Platform.Api.csproj -c Release -r linux-x64 --no-restore -o "$RUNNER_TEMP/aot-baseline"
          sudo python3 aot-baseline/ops/staging/check_ci_canary.py "$RUNNER_TEMP/aot-baseline/Platform.Api" aot-baseline/ops/migrations/0001_core.sql
      - name: Qualify keyless plaintext roles in a disposable PostgreSQL canary
        shell: bash
        run: |
          private=$(mktemp -d "$RUNNER_TEMP/akanti-ef-qualification-XXXXXX")
          trap 'rm -rf "$private"' EXIT
          dotnet restore src/Platform.SchemaRunner/Platform.SchemaRunner.csproj -r linux-x64 --locked-mode
          dotnet publish src/Platform.SchemaRunner/Platform.SchemaRunner.csproj -c Release -r linux-x64 -p:PublishAot=false --no-restore --no-self-contained -o "$private/runner"
          SHOP_TEST_ALLOW_DATABASE_CREATION=1 "$private/runner/Platform.SchemaRunner" --write-plain-postgres-schema --output "$private/schema.sql"
          digest=$(sha256sum "$private/schema.sql" | cut -d ' ' -f 1)
          sudo python3 ops/staging/check_ci_canary.py artifacts/staging/Api "$private/schema.sql" --plaintext-sha256 "$digest"
      - name: Package managed staging candidate
        shell: bash
        run: |
          printf '%s\n' "$GITHUB_SHA" > artifacts/staging/SOURCE_COMMIT
          (
            cd artifacts/staging
            find Api BotHost -type f -print0 | sort -z | xargs -0 sha256sum
          ) > artifacts/staging/SHA256SUMS
          tar -czf artifacts/staging/Platform.Api-linux-x64.tar.gz \
            -C artifacts/staging Api BotHost SHA256SUMS SOURCE_COMMIT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: staging-api-linux-x64-${{ github.sha }}
          path: |
            artifacts/staging/Platform.Api-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 7
  deploy-staging:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy_staging && inputs.staging_backend == 'sqlite'
    needs: [qualify, build-staging-api]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: akanti-staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: staging-api-linux-x64-${{ github.sha }}
          path: artifacts/staging-delivery
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: offline-qualification-${{ github.sha }}
          path: artifacts/qualified-delivery
      - name: Publish tested image to Docker Hub
        id: publish
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DOCKERHUB_NAMESPACE" =~ ^[a-z0-9][a-z0-9_-]*$ ]]
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bundle=$(mktemp -d "$RUNNER_TEMP/akanti-image.XXXXXX")
          tar -xzf artifacts/staging-delivery/Platform.Api-linux-x64.tar.gz -C "$bundle"
          test "$(cat "$bundle/SOURCE_COMMIT")" = "$GITHUB_SHA"
          (cd "$bundle" && sha256sum --check SHA256SUMS)
          for role in JobHost SchemaRunner; do
            cp -a "artifacts/qualified-delivery/artifacts/managed/$role" "$bundle/"
          done
          for role in Api BotHost JobHost SchemaRunner; do
            chmod 0555 "$bundle/$role/Platform.$role"
          done
          install -m 0555 ops/staging/deploy-sqlite-runtime.sh "$bundle/deploy-sqlite-runtime.sh"
          install -m 0444 ops/staging/sqlite-stage-provision.py "$bundle/sqlite-stage-provision.py"
          repository="docker.io/$DOCKERHUB_NAMESPACE/akanti"
          tag="$repository:git-$GITHUB_SHA"
          docker build --platform linux/amd64 --file ops/staging/Dockerfile \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "$tag" "$bundle"
          docker run --rm --network none "$tag" --qualify
          docker run --rm --network none --entrypoint /app/BotHost/Platform.BotHost "$tag" --qualify-ingress
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d "$RUNNER_TEMP/akanti-docker.XXXXXX")
          printf '%s\n' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          docker push "$tag" | tee "$RUNNER_TEMP/akanti-push.log"
          digest=$(sed -nE 's/^.*digest: (sha256:[a-f0-9]{64}) size: [0-9]+$/\1/p' "$RUNNER_TEMP/akanti-push.log")
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'image=%s@%s\n' "$repository" "$digest" >> "$GITHUB_OUTPUT"
      - name: Pull and deploy on staging server
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          RELEASE_IMAGE: ${{ steps.publish.outputs.image }}
          SHOP_DEPLOY_MODE: ${{ inputs.staging_backend }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SHOP_DEPLOY_MODE" == sqlite ]]
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[1-9][0-9]{0,4}$ ]] && (( DEPLOY_PORT <= 65535 ))
          [[ "$RELEASE_IMAGE" =~ ^docker\.io/[a-z0-9][a-z0-9_-]*/akanti@sha256:[a-f0-9]{64}$ ]]
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/akanti-ssh.XXXXXX")
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh -i "$ssh_dir/key" -p "$DEPLOY_PORT" -o BatchMode=yes \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o ConnectTimeout=15 \
            -- "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$RELEASE_IMAGE" "$GITHUB_SHA" "$SHOP_DEPLOY_MODE" \
            < ops/staging/deploy-dockerhub.sh
