name: shop-backend-configuration
x-isolated: &isolated
  profiles: [configuration-only]
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  network_mode: none
  restart: "no"
services:
  api:
    <<: *isolated
    image: ${SHOP_API_IMAGE:?Set a reviewed immutable image digest}
    user: "10001:10001"
    entrypoint: [/app/Platform.Api]
    command: []
  bot-a:
    <<: *isolated
    image: ${SHOP_BOT_IMAGE:?Set a reviewed immutable image digest}
    user: "10011:10011"
    entrypoint: [/app/Platform.BotHost]
    command: []
  bot-b:
    <<: *isolated
    image: ${SHOP_BOT_IMAGE:?Set a reviewed immutable image digest}
    user: "10012:10012"
    entrypoint: [/app/Platform.BotHost]
    command: []
  bot-c:
    <<: *isolated
    image: ${SHOP_BOT_IMAGE:?Set a reviewed immutable image digest}
    user: "10013:10013"
    entrypoint: [/app/Platform.BotHost]
    command: []
  jobs:
    <<: *isolated
    image: ${SHOP_JOB_IMAGE:?Set a reviewed immutable image digest}
    user: "10021:10021"
    entrypoint: [/app/Platform.JobHost]
    command: []
